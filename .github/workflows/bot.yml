‎# ======================= الإعدادات =======================
FLOOD_LIMIT = 5              # رسائل
FLOOD_WINDOW = 10            # خلال كم ثانية
CAPTCHA_SECONDS = 120        # مهلة التحقق للعضو الجديد
NSFW_THRESHOLD = 0.45        # حساسية فحص الصور (أقل = أشد)
STRIKE_WINDOW = 24 * 3600    # المخالفات تنحسب خلال 24 ساعة
‎# العقوبة حسب رقم المخالفة: None = تحذير فقط، رقم = دقائق كتم، "ban" = حظر
