‎# ======================= تطبيع النص =======================
_DIACRITICS = re.compile(r"[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]")
_INVISIBLE = re.compile(r"[\u200b-\u200f\u202a-\u202e\u2060-\u2064\ufeff]")
_LEET = str.maketrans({"0": "o", "1": "i", "3": "e", "4": "a", "5": "s", "@": "a", "$": "s", "!": "i"})
_PREFIXES = ("وال", "بال", "فال", "لل", "ال", "يا", "و", "ف", "ب")


def normalize(text: str) -> str:
    text = unicodedata.normalize("NFKC", text).lower()
    text = _INVISIBLE.sub("", text)
    text = _DIACRITICS.sub("", text)
    text = re.sub("[إأآٱ]", "ا", text)
    text = text.replace("ة", "ه").replace("ى", "ي").replace("ؤ", "و").replace("ئ", "ي")
    text = text.translate(_LEET)
    text = re.sub(r"([\u0600-\u06FF])\1+", r"\1", text)   # كسسسس ← كس
    text = re.sub(r"([a-z])\1{2,}", r"\1\1", text)         # fuuuuck ← fuuck
‎    # دمج الحروف المفصولة: ك.س / ك س / f-u-c-k
    text = re.sub(r"(?<=\b\w)[\s.\-_*/\\|,]+(?=\w\b)", "", text)
    return text


def load_words() -> set[str]:
    words = set()
    if WORDS_FILE.exists():
        for line in WORDS_FILE.read_text(encoding="utf-8").splitlines():
            line = line.strip()
            if line and not line.startswith("#"):
                words.add(normalize(line))
    return words


BAD_WORDS = load_words()


def _collapse(s: str) -> str:
    return re.sub(r"([a-z])\1+", r"\1", s)


def find_bad_word(text: str | None) -> str | None:
    if not text:
        return None
    norm = normalize(text)
    tokens = re.findall(r"\w+", norm)
    collapsed_bad = {_collapse(w): w for w in BAD_WORDS if len(_collapse(w)) >= 3}
    for t in tokens:
        candidates = {t}
        for p in _PREFIXES:
            if t.startswith(p) and len(t) - len(p) >= 2:
                candidates.add(t[len(p):])
        for c in candidates:
            if c in BAD_WORDS:
                return c
            if _collapse(c) in collapsed_bad:  # fuuuuck / shiiit
                return collapsed_bad[_collapse(c)]
‎            # الكلمات الطويلة (4 أحرف فأكثر) نكشفها حتى لو داخل كلمة ثانية
            for w in BAD_WORDS:
                if len(w) >= 4 and w in c:
                    return w
    return None


